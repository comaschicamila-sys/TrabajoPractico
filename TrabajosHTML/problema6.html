<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Galería de fotografías</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 2rem;
			box-sizing: border-box;
			font-family: Georgia, "Times New Roman", serif;
			color: #263238;
			background: #eef3f1;
		}

		main {
			width: min(100%, 900px);
		}

		h1 {
			margin: 0 0 1.5rem;
			text-align: center;
			font-size: clamp(1.8rem, 4vw, 2.8rem);
		}

		.galeria {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
			gap: 1.5rem;
		}

		figure {
			margin: 0;
			padding: 1rem;
			background: #ffffff;
			border: 1px solid #d5dfdc;
			box-shadow: 0 8px 24px rgba(38, 50, 56, 0.12);
		}

		img {
			display: block;
			width: 100%;
			height: auto;
		}

		figcaption {
			padding-top: 0.9rem;
			text-align: center;
			font-size: 1.2rem;
			font-weight: bold;
		}
	</style>
</head>
<body>
	<main>
		<h1>Galería de fotografías</h1>
		<section class="galeria" aria-label="Fotografías">
			<figure>
				<img src="foto2.jpg" alt="Fotografía 2">
				<figcaption>Fotografía 2</figcaption>
			</figure>
			<figure>
				<img src="foto3.jpg" alt="Fotografía 3">
				<figcaption>Fotografía 3</figcaption>
			</figure>
		</section>
	</main>
</body>
</html>
